name: PR Debug build

# Triggered by pull requests only; PRs may target any branch
on:
  pull_request:

# Forced-push friendly: every new push (including force push) to the same PR
# starts a new run and cancels the old one, keeping only the latest result
concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: PR Debug Build
    runs-on: ubuntu-latest
    steps:
      # Version numbering depends on the commit count; fetch the full history
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accept SDK licenses with the runner's preinstalled sdkmanager; AGP then
      # downloads any missing Platform 37. android-actions/setup-android is avoided
      # because it runs `sdkmanager tools`, a package that has been removed from
      # the SDK repository, which makes the step fail with exit code 1.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Build a runnable debug APK; no signing properties are passed, so the
      # debug build type uses the default debug signing config
      - name: Debug build (full warnings)
        run: |
          # gradlew may lose its executable bit after checkout; restore it first
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-pr-${{ github.event.pull_request.number }}
          path: build/app/outputs/apk/debug/*.apk
