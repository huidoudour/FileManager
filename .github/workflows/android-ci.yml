name: Android CI

# Triggered on every push to master
on:
  push:
    branches:
      - master

# Keep every master build: each push produces a distinct release artifact
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      # Version numbering depends on the commit count; fetch the full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Accept SDK licenses with the runner's preinstalled sdkmanager; AGP then
      # downloads any missing Platform 37. android-actions/setup-android is avoided
      # because it runs `sdkmanager tools`, a package that has been removed from
      # the SDK repository, which makes the step fail with exit code 1.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # No signing properties are passed, so the release build type falls back
      # to the debug signing config and produces a runnable release APK
      - name: Release build (full warnings)
        run: |
          # gradlew may lose its executable bit after checkout; restore it first
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode all

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
