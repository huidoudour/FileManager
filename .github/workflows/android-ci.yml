name: Android CI

# Triggered on every push to master
on:
  push:
    branches:
      - master

# Keep every master build: each push produces a distinct release artifact
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      # Version numbering depends on the commit count; fetch the full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Initialize SDK Manager and accept licenses; missing Platform 37 is downloaded by AGP
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # No signing properties are passed, so the release build type falls back
      # to the debug signing config and produces a runnable release APK
      - name: Release build (full warnings)
        run: |
          # gradlew may lose its executable bit after checkout; restore it first
          chmod +x gradlew
          ./gradlew assembleRelease --warning-mode all

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
