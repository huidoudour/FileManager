name: Android CI

# Triggered on every push to any branch; '**' keeps tag pushes (e.g. releases)
# from starting a new build
on:
  push:
    branches:
      - '**'

# Keep every build: each push produces a distinct release artifact
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      # Version numbering depends on the commit count; fetch the full history
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accept SDK licenses with the runner's preinstalled sdkmanager; AGP then
      # downloads any missing Platform 37. android-actions/setup-android is avoided
      # because it runs `sdkmanager tools`, a package that has been removed from
      # the SDK repository, which makes the step fail with exit code 1.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Rebuild the release keystore from the base64 secret stored in the repo
      # settings, so the release APK carries the release certificate instead of
      # the debug one. When the secret is unavailable (e.g. a fork), the step
      # only warns and the build keeps falling back to the debug signing config.
      - name: Prepare signing keystore
        env:
          KEY_STORE_B64: ${{ secrets.SIGN_KEY_STORE_B64 }}
          KEY_STORE_PASS: ${{ secrets.SIGN_KEY_PASSWD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          if [ -z "$KEY_STORE_B64" ]; then
            echo "::warning::SIGN_KEY_STORE_B64 is not configured, the release APK falls back to the debug signing key"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          # Strip whitespace/CRLF so a base64 payload copied on Windows decodes
          printf '%s' "$KEY_STORE_B64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE"
          # Fail here with a clear message instead of inside the signing task
          # when the keystore is truncated or the password/alias does not match
          keytool -list -keystore "$KEYSTORE" -storepass:env KEY_STORE_PASS -alias "$KEY_ALIAS" > /dev/null
          {
            echo "SIGN_KEYSTORE=$KEYSTORE"
            echo "SIGNING_ENABLED=true"
          } >> "$GITHUB_ENV"

      # Signing properties are passed only when the keystore was decoded above;
      # without them the release build type uses the debug signing config
      - name: Release build (full warnings)
        env:
          KEY_STORE_PASS: ${{ secrets.SIGN_KEY_PASSWD }}
          KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
        run: |
          # gradlew may lose its executable bit after checkout; restore it first
          chmod +x gradlew
          SIGN_ARGS=()
          if [ "${SIGNING_ENABLED:-false}" = "true" ]; then
            # SIGN_KEY_PASSWD doubles as the key password (Android keystores
            # created by keytool/Studio normally use the store password for both)
            SIGN_ARGS=(
              -PstoreFile="$SIGN_KEYSTORE"
              -PstorePassword="$KEY_STORE_PASS"
              -PkeyAlias="$KEY_ALIAS"
              -PkeyPassword="$KEY_STORE_PASS"
            )
          fi
          ./gradlew assembleRelease --warning-mode all "${SIGN_ARGS[@]}"

      # Informational only: print the certificate that actually signed the APK
      - name: Verify APK signature
        if: env.SIGNING_ENABLED == 'true'
        continue-on-error: true
        run: |
          APKSIGNER="$(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner | tail -n 1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/apk/release/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/apk/release/*.apk
