name: Android CI

# 仅 Pull Request 触发 CI 构建，PR 可指向任意分支（即监控全部分支）
on:
  pull_request:

# 适配强制推送：同一 PR 的每次新推送（含 force push）都会触发新运行，
# 并自动取消该 PR 正在执行的旧运行，只保留最新代码的构建结果
concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: CI 构建
    runs-on: ubuntu-latest
    steps:
      # 版本号依赖 git 提交数，需拉取完整历史
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 初始化 SDK Manager 并接受许可，缺失的 Platform 37 由 AGP 自动下载
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 单元测试 + Debug 构建（含完整警告）
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode all

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
