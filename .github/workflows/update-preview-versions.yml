name: Update Preview Versions

on:
  schedule:
    # Daily at UTC 02:00 (Beijing 10:00): check for preview version updates
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-preview-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for preview version updates
        id: check
        run: python .github/scripts/update_preview_versions.py

      - name: Create pull request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Sign commits as GitHub Actions[bot] with the default GITHUB_TOKEN, marked Verified by GitHub; no extra keys needed
          sign-commits: true
          commit-message: ${{ steps.check.outputs.commit_message }}
          branch: update/preview-versions
          delete-branch: true
          title: ${{ steps.check.outputs.pr_title }}
          body: ${{ steps.check.outputs.pr_body }}
          labels: dependencies
