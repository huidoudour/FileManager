name: Update Preview Versions

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）检查一次预览版本更新
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-preview-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for preview version updates
        id: check
        run: python .github/scripts/update_preview_versions.py

      # 导入 GPG 私钥并启用 commit.gpgsign，使自动提交带签名（GitHub 显示 Verified）
      # 前提：仓库 Secrets 中配置 GPG_PRIVATE_KEY（私钥）与 GPG_PASSPHRASE（口令，可选），
      #       且公钥已添加到 GitHub 账户，密钥 UID 邮箱与账户邮箱一致
      - name: Import GPG key
        if: steps.check.outputs.updated == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create pull request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.check.outputs.commit_message }}
          branch: update/preview-versions
          delete-branch: true
          title: ${{ steps.check.outputs.pr_title }}
          body: ${{ steps.check.outputs.pr_body }}
          labels: dependencies
          # 提交者信息取 GPG 密钥 UID，保证邮箱与 GitHub 账户一致才能显示 Verified
          committer: ${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>
          author: ${{ steps.import-gpg.outputs.name }} <${{ steps.import-gpg.outputs.email }}>
